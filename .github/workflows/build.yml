name: build

on:
  push:
    branches:
      - master

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
        run: |
          VERSION=$(git describe --tags $(git rev-list --tags --max-count=1) 2>/dev/null || echo dev)
          REVISION=$(git rev-parse HEAD)
          BUILTAT=$(date +%Y-%m-%dT%H:%M:%S)
          LDFLAGS="-s -X github.com/projecteru2/resource-extend/version.VERSION=${VERSION} \
                   -X github.com/projecteru2/resource-extend/version.REVISION=${REVISION} \
                   -X github.com/projecteru2/resource-extend/version.BUILTAT=${BUILTAT}"
          for plugin in resource-gpu resource-storage; do
            go build -ldflags "${LDFLAGS}" -o ${plugin}-${{ matrix.goos }}-${{ matrix.goarch }} ./cmd/${plugin}
          done

      - name: Upload binary artifacts
        uses: actions/upload-artifact@v7
        with:
          name: resource-extend-${{ matrix.goos }}-${{ matrix.goarch }}
          path: resource-*-${{ matrix.goos }}-${{ matrix.goarch }}
          retention-days: 30
